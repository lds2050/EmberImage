name: Build and release installers

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }} installer
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            script: dist:win
            artifact: emberimage-windows
            path: release/*.exe
          - name: macOS Apple Silicon
            os: macos-latest
            script: dist:mac:arm64
            artifact: emberimage-macos-arm64
            path: release/*-mac-arm64.dmg
          - name: macOS Intel
            os: macos-latest
            script: dist:mac:x64
            artifact: emberimage-macos-x64
            path: release/*-mac-x64.dmg

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run syntax checks
        run: npm run check

      - name: Build installer
        run: npm run ${{ matrix.script }}

      - name: Upload installer artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download installers
        uses: actions/download-artifact@v5
        with:
          path: installers
          merge-multiple: true

      - name: Create release and upload installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" installers/* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "EmberImage $GITHUB_REF_NAME"
